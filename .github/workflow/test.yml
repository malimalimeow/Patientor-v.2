name: Tests

on:
  push:
  pull_request:

jobs:
  backend-tests:
    name: Backend API Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tests/APITest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/APITest/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm test

  frontend-tests:
    name: Frontend Playwright Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tests/FrontTest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/FrontTest/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run frontend tests
        run: npm test
